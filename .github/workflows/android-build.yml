name: Android CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

# A newer push cancels the older still-running build instead of queueing behind it.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LIBV2RAY_VERSION: v26.10.31

jobs:
  # Unit tests run in parallel with the APK build, so they no longer delay the APK.
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache libv2ray.aar
        uses: actions/cache@v4
        with:
          path: app/libs/libv2ray.aar
          key: libv2ray-${{ env.LIBV2RAY_VERSION }}

      # Robolectric downloads its android-all jars on every run unless they are cached.
      - name: Cache Robolectric jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Create debug keystore
        run: |
          keytool -genkeypair -noprompt -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Run unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace

  build:
    name: Assemble minified arm64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache libv2ray.aar
        uses: actions/cache@v4
        with:
          path: app/libs/libv2ray.aar
          key: libv2ray-${{ env.LIBV2RAY_VERSION }}

      - name: Cache world map asset
        id: mapcache
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/world.bin
          key: world-bin-${{ hashFiles('scripts/build-map.py') }}

      - name: Build world map asset (Natural Earth borders)
        if: steps.mapcache.outputs.cache-hit != 'true'
        run: |
          [ -f app/src/main/assets/world.bin ] || python3 scripts/build-map.py

      - name: Create debug keystore
        run: |
          keytool -genkeypair -noprompt -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # Only arm64 is published, so only arm64 is built (-PabiOnly). No --no-daemon: the JVM is reused.
      - name: Assemble minified arm64 APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease -PabiOnly=arm64-v8a --stacktrace

      - name: Pick arm64-v8a APK
        run: |
          mkdir -p dist
          ls -lh app/build/outputs/apk/release/
          APK=$(ls app/build/outputs/apk/release/*arm64-v8a*.apk | head -n 1)
          cp "$APK" dist/HollowVPN-arm64-v8a.apk
          ls -lh dist

      - name: Upload APK (zipped workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: hollow-vpn-arm64-apk
          path: dist/HollowVPN-arm64-v8a.apk
          if-no-files-found: error

  # Publishing only happens when BOTH the tests and the build passed.
  publish:
    name: Publish to GitHub Release
    needs: [test, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: hollow-vpn-arm64-apk
          path: dist

      # Direct, un-zipped APK download: Releases page -> "debug-latest" -> HollowVPN-arm64-v8a.apk
      - name: Move debug-latest tag to this commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f debug-latest
          git push -f origin refs/tags/debug-latest

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: Latest build (arm64-v8a)
          prerelease: true
          make_latest: false
          body: |
            Automatic build (arm64-v8a, minified) from commit `${{ github.sha }}`.
            Download `HollowVPN-arm64-v8a.apk` below and install it directly (no unzipping needed).
          files: dist/HollowVPN-arm64-v8a.apk
