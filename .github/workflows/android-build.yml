name: Android CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Test and assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK_ROOT" ] && [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          fi

      - name: Create debug keystore
        run: |
          keytool -genkeypair -noprompt \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Run unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Rename debug APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/HollowVPN-debug.apk
          ls -lh dist

      - name: Upload debug APK (zipped workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: hollow-vpn-debug-apk
          path: dist/HollowVPN-debug.apk
          if-no-files-found: error

      # Direct, un-zipped APK download: Releases page -> "debug-latest" -> HollowVPN-debug.apk
      - name: Move debug-latest tag to this commit
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f debug-latest
          git push -f origin refs/tags/debug-latest

      - name: Publish debug APK to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: Latest debug build
          prerelease: true
          make_latest: false
          body: |
            Automatic debug build from commit `${{ github.sha }}`.
            Download `HollowVPN-debug.apk` below and install it directly (no unzipping needed).
          files: dist/HollowVPN-debug.apk
