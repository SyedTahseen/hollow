[versions]
agp = "9.1.1"
coreKtx = "1.18.0"
junit = "4.13.2"
lifecycle = "2.8.7"
activityCompose = "1.10.1"
kotlin = "2.2.10"
composeBom = "2024.09.00"
googleDevtoolsKsp = "2.3.5"
room = "2.7.0"
coroutines = "1.10.2"
core = "1.6.1"
camera = "1.5.0"
okhttp = "4.10.0"
robolectric = "4.16.1"
zxingCore = "3.5.3"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
